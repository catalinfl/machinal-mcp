# Complete multi-track narrated portrait (9:16) production example with compiled
# Svelte 2D scenes, transitions, archival film grain, preserved Pass 1 narration +
# word-timed captions, AND separate non-overlapping audio tracks (narration,
# ambience, spot SFX). All filenames, hashes and timings below are synthetic
# fixtures — replace them with real returned project metadata.
#
# CRITICAL SETTINGS MATRIX (do NOT mix these namespaces):
# 1. Envelope: top-level keys are `document`, `bindings`, `assets` (never put
#    `version`, `jobs`, `tracks`, `captions` or `output` at root).
# 2. `document.output.aspect` uses `portrait` | `landscape` | `classic`.
#    `image.generate` jobs in `document.before` MUST use ratio strings `'9:16'`,
#    `'16:9'`, `'4:3'`, `'3:4'`, `'1:1'` — NEVER `aspect: portrait`!
# 3. For isolated foreground cutouts in `image.generate`, use `background: transparent`
#    (NOT `transparent: true`) with `model: openai/gpt-image-2.5-sunburst`.
# 4. In a Pass 2 image-only `generate_assets` call, include at least one `placements`
#    entry with positive duration (e.g. `duration: 1s`) or keep the Pass 1 narration
#    track so post-generation compilation does not fail with 422 `invalid_duration`.
# 5. Prefer `patch_recipe(sourceJobId: <pass1JobId>, operations: [...])` to add
#    compiled scenes, transitions, effects and SFX while preserving Pass 1 captions
#    100% verbatim.
# 6. Audio tracks CANNOT have overlapping clips on the same track — put narration,
#    ambience/projector/music, and spot SFX on SEPARATE audio tracks. Audio `volume`
#    is 0–200 PERCENT (100 = normal narration, 12–35 = ambience/SFX), NEVER 0.0–1.0.
document:
  version: 2
  mode: assemble
  instanceId: narrated-2d-scenes-sfx
  jobs:
    - id: voice-ro
      type: speech.generate
      language: ro
      model: google/gemini-3.8-flash-tts
      voice: Charon
      instructions: Calm documentary narration with native Romanian pronunciation.
      text: >-
        Două scene animate 2D ilustrează tema documentarului.
        Sunetele discrete subliniază momentele vizuale cheie.
      resultAssetId: example-voice.mp3
    - id: captions-ro
      type: captions.generate
      language: ro
      maxWords: 4
      style:
        fontFamily: oswald
        fontSize: 52
        x: 540
        y: 1620
        anchor: center
        align: center
        color: '#F4EFE6'
        strokeColor: '#14110F'
        strokeWidth: 4
        highlightMode: word
        highlightAnimation: none
      resultTextIds:
        - captions-ro/caption/0
        - captions-ro/caption/1
  tracks:
    # Video track: compiled Svelte 2D scenes with motion: none and exact 0.30s overlap
    # clip_s1 ends at 0 + (7.8 - 0) / 1 = 7.8s; clip_s2 starts at 7.5s -> overlap = 0.30s
    - id: main_video
      type: video
      name: Compiled 2D Scenes
      clips:
        - id: clip_s1
          assetId: scene_1
          start: 0s
          inPoint: 0s
          outPoint: 7.8s
          playbackRate: 1
          motion: none
          volume: 0
        - id: clip_s2
          assetId: scene_2
          start: 7.5s
          inPoint: 0s
          outPoint: 6.5s
          playbackRate: 1
          motion: none
          volume: 0
    # Audio track 1: narration (preserved verbatim from Pass 1; volume 100 = 100%)
    - id: recipe/audio/narration
      type: audio
      name: narration
      clips:
        - id: recipe/voice-ro/placement/0
          assetId: example-voice.mp3
          start: 0.4s
          inPoint: 0s
          outPoint: 13.2s
          playbackRate: 1
          volume: 100
    # Audio track 2: ambient bed on its OWN audio track so it never collides with spot SFX
    - id: audio_ambience
      type: audio
      name: Archival Ambience
      clips:
        - id: sfx_proj_open
          assetId: sfx_projector
          start: 0.05s
          inPoint: 0s
          outPoint: 4.5s
          playbackRate: 1
          volume: 14
          fadeIn: 0.2s
          fadeOut: 1.2s
        - id: sfx_proj_close
          assetId: sfx_projector
          start: 9.5s
          inPoint: 2s
          outPoint: 6.2s
          playbackRate: 1
          volume: 14
          fadeIn: 0.5s
          fadeOut: 1.2s
    # Audio track 3: non-overlapping spot foley accents synced to visible scene actions
    - id: audio_sfx
      type: audio
      name: Spot Foley SFX
      clips:
        - id: sfx_stamp_hit_1
          assetId: sfx_stamp
          start: 0.85s
          inPoint: 0s
          outPoint: 0.55s
          playbackRate: 1
          volume: 28
        - id: sfx_stamp_hit_2
          assetId: sfx_stamp
          start: 7.65s
          inPoint: 0s
          outPoint: 0.55s
          playbackRate: 1
          volume: 30
  transitions:
    - id: t_s1_s2
      trackId: main_video
      leftClipId: clip_s1
      rightClipId: clip_s2
      preset: wipe-left
      duration: 0.3s
  effects:
    - id: fx_archival_grain
      trackId: main_video
      preset: film-grain
      start: 0s
      duration: 14s
      params:
        strength: 6
        seed: 1989
  texts:
    - id: captions-ro/caption/0
      text: Două scene animate 2D
      start: 0.6s
      duration: 3.4s
      isCaption: true
      x: 540
      y: 1620
      anchor: center
      align: center
      fontFamily: oswald
      fontSize: 52
      color: '#F4EFE6'
      strokeColor: '#14110F'
      strokeWidth: 4
      highlightMode: word
      highlightAnimation: none
      words:
        - {text: Două, start: 0s, end: 0.6s}
        - {text: scene, start: 0.6s, end: 1.3s}
        - {text: animate, start: 1.3s, end: 2.3s}
        - {text: 2D, start: 2.3s, end: 3.4s}
    - id: captions-ro/caption/1
      text: subliniază momentele vizuale cheie.
      start: 8.1s
      duration: 4.5s
      isCaption: true
      x: 540
      y: 1620
      anchor: center
      align: center
      fontFamily: oswald
      fontSize: 52
      color: '#F4EFE6'
      strokeColor: '#14110F'
      strokeWidth: 4
      highlightMode: word
      highlightAnimation: none
      words:
        - {text: subliniază, start: 0s, end: 1.1s}
        - {text: momentele, start: 1.1s, end: 2.2s}
        - {text: vizuale, start: 2.2s, end: 3.4s}
        - {text: cheie., start: 3.4s, end: 4.5s}
  output:
    aspect: portrait
    fit: contain
    resolution: 1080p
    fps: 30
    format: mp4
    quality: normal
bindings: {}
assets:
  - id: scene_1
    file: ai_scene_0123456789abcdef0123456789abcdef_01.scene.json
    version: synthetic-example-scene-1
    kind: video
    duration: 7.8s
    width: 1080
    height: 1920
  - id: scene_2
    file: ai_scene_0123456789abcdef0123456789abcdef_02.scene.json
    version: synthetic-example-scene-2
    kind: video
    duration: 6.5s
    width: 1080
    height: 1920
  - id: example-voice.mp3
    file: example-voice.mp3
    version: synthetic-example-voice
    kind: audio
    duration: 13.2s
    hasAudio: true
  - id: sfx_projector
    file: sound_projector_example.mp3
    version: synthetic-example-projector
    kind: audio
    duration: 11.9s
    hasAudio: true
  - id: sfx_stamp
    file: sound_stamp_example.mp3
    version: synthetic-example-stamp
    kind: audio
    duration: 0.58s
    hasAudio: true
